<!DOCTYPE html>
<html>
<head>
    <title>Item Return</title>
</head>

<body>

    <h2>DENIM JACKET</h2>

    <p id="itemName"></p>
    <p id="deliveryStatus"></p>
    <p id="days"></p>
    <p id="result"></p>
    <p id="itemCheck"></p>
    <p id="deleteCheck"></p>

    <button onclick="checkReturn()">Check Return Status</button>

    <script>

        function checkReturn() {

            var order = {
                itemName: "Denim Jacket",
                isDelivered: true,
                daysSinceDelivery: 7
            };

            var returnStatus =
                order.isDelivered && order.daysSinceDelivery <= 7;

            document.getElementById("itemName").innerHTML =
                "Item Name: " + order.itemName;

            document.getElementById("deliveryStatus").innerHTML =
                "Delivery Status: Item has been delivered";

            document.getElementById("days").innerHTML =
                "Days Since Delivery: " + order.daysSinceDelivery;

            document.getElementById("result").innerHTML =
                "Return Status: " +
                (returnStatus ? "Eligible for Return" : "Return Period Expired");

            var itemExists = "itemName" in order;

            document.getElementById("itemCheck").innerHTML =
                "Item Name Property Exists: " + itemExists;

            delete order.daysSinceDelivery;

            document.getElementById("deleteCheck").innerHTML =
                "Days Since Delivery: " +
                !("daysSinceDelivery" in order);

        }

    </script>

</body>
</html>
